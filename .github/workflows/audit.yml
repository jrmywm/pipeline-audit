name: audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: read
  security-events: write

jobs:
  self-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.11'
      - name: Install pipeline-audit
        run: pip install -e '.[dev]'
      - name: Run tests
        run: pytest -q
      - name: Validate rule precision and recall
        run: python scripts/validate.py
      - name: Self-audit
        run: pipeline-audit scan . --format sarif -o audit_report --fail-on Medium
      - name: Upload SARIF to GitHub Code Scanning
        if: ${{ always() && hashFiles('audit_report.sarif') != '' && (github.event_name == 'push' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]')) }}
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938  # v4.37.9
        with:
          sarif_file: audit_report.sarif
