# Ground truth for pipeline-audit snapshot validation.
# Drafted by AI per Option B — user review/veto required before v1.
#
# Each snapshot lists expected findings by (rule_id, file).
# validate.py compares actual findings against these expectations
# and computes precision + recall per rule.
#
# Convention:
#   expected: []  → no findings should fire (true negative)
#   expected: [{rule_id, file, severity}]  → true positive(s)

version: "1.0"
snapshots:
  # ─── Docker snapshots (01–10) ─────────────────────────────────────────────
  01_docker_no_user:
    description: "Dockerfile without USER — runs as root"
    expected:
      - rule_id: DOCKER-R001
        file: Dockerfile
        severity: High
  02_docker_with_user:
    description: "Dockerfile with USER appuser"
    expected: []
  03_docker_user_last:
    description: "Dockerfile with USER 1001 at the end"
    expected: []
  04_docker_user_numeric:
    description: "Dockerfile with USER 1001 early"
    expected: []
  05_docker_multi_stage_no_user:
    description: "Multi-stage Dockerfile, no USER in final stage"
    expected:
      - rule_id: DOCKER-R001
        file: Dockerfile
        severity: High
  06_docker_multi_stage_with_user:
    description: "Multi-stage Dockerfile, USER 1001 in final stage"
    expected: []
  07_docker_directive_no_user:
    description: "Dockerfile with # syntax directive but no USER"
    expected:
      - rule_id: DOCKER-R001
        file: Dockerfile
        severity: High
  08_docker_heredoc_no_user:
    description: "Dockerfile with heredoc RUN, no USER"
    expected:
      - rule_id: DOCKER-R001
        file: Dockerfile
        severity: High
  09_docker_only_from:
    description: "Minimal Dockerfile: FROM scratch only"
    expected:
      - rule_id: DOCKER-R001
        file: Dockerfile
        severity: High
  10_docker_arg_user:
    description: "Dockerfile with ARG then USER $UID"
    expected: []

  # ─── GHA snapshots (11–20) ────────────────────────────────────────────────
  11_gha_tag_v4:
    description: "Workflow with actions/checkout@v4"
    expected:
      - rule_id: GHA-R001
        file: ci.yml
        severity: Medium
  12_gha_tag_v3_specific:
    description: "Workflow with @v3.2.1 and @v5 (both tag-pinned)"
    expected:
      - rule_id: GHA-R001
        file: ci.yml
        severity: Medium
      - rule_id: GHA-R001
        file: ci.yml
        severity: Medium
  13_gha_sha_pinned:
    description: "Workflow with both actions SHA-pinned"
    expected: []
  14_gha_branch_main:
    description: "Workflow with actions/checkout@main"
    expected:
      - rule_id: GHA-R001
        file: ci.yml
        severity: Medium
  15_gha_local_action:
    description: "Workflow using ./local-action (exempt)"
    expected: []
  16_gha_docker_action:
    description: "Workflow using docker://alpine:3.19 (exempt)"
    expected: []
  17_gha_mixed:
    description: "Workflow with 1 SHA-pinned + 1 tag-pinned (1 finding)"
    expected:
      - rule_id: GHA-R001
        file: ci.yml
        severity: Medium
  18_gha_multi_job_unpinned:
    description: "2 jobs with 3 unpinned uses total"
    expected:
      - rule_id: GHA-R001
        file: ci.yml
        severity: Medium
      - rule_id: GHA-R001
        file: ci.yml
        severity: Medium
      - rule_id: GHA-R001
        file: ci.yml
        severity: Medium
  19_gha_all_sha_pinned:
    description: "Workflow with both actions SHA-pinned"
    expected: []
  20_gha_no_uses_steps:
    description: "Workflow with only run: steps, no uses:"
    expected: []

  # ─── DOCKER-R002 snapshots (21–30) ───────────────────────────────────────
  21_docker_env_secret:
    description: "Dockerfile with ENV API_KEY=high-entropy secret value"
    expected:
      - rule_id: DOCKER-R002
        file: Dockerfile
        severity: Critical
  22_docker_arg_secret:
    description: "Dockerfile with ARG GITHUB_TOKEN=high-entropy secret value"
    expected:
      - rule_id: DOCKER-R002
        file: Dockerfile
        severity: Critical
  23_docker_env_safe_label:
    description: "Dockerfile with only allowlisted ENV names (NODE_ENV, BUILD_NUMBER, LANG)"
    expected: []
  24_docker_env_low_entropy:
    description: "Dockerfile with ENV API_KEY=abc (entropy below 3.5 floor)"
    expected: []
  25_docker_env_mixed:
    description: "Dockerfile with NODE_ENV (safe) + API_TOKEN (secret, high entropy) + OTHER_FLAG (no keyword)"
    expected:
      - rule_id: DOCKER-R002
        file: Dockerfile
        severity: Critical
  26_docker_arg_secret:
    description: "Dockerfile with ARG PASSWORD=high-entropy secret value"
    expected:
      - rule_id: DOCKER-R002
        file: Dockerfile
        severity: Critical
  27_docker_arg_no_secret:
    description: "Dockerfile with ARG VERSION/UID only, no secret-keyword names"
    expected: []
  28_docker_env_keyword_substring:
    description: "Dockerfile with ENV SECRETAPI_KEY=high-entropy (name contains KEY substring)"
    expected:
      - rule_id: DOCKER-R002
        file: Dockerfile
        severity: Critical
  29_docker_env_no_secret_keyword:
    description: "Dockerfile with ENV APP_VERSION/BUILD_LABEL (no secret-keyword in name)"
    expected: []
  30_docker_env_var_substitution:
    description: "Dockerfile with ENV API_KEY={{EV_VAR}} (low-entropy placeholder values)"
    expected: []

  # ─── GHA-R002 snapshots (31–40) ───────────────────────────────────────────
  31_gha_secret_inline_run:
    description: "Workflow interpolating ${{ secrets.DEPLOY_KEY }} into an inline run:"
    expected:
      - rule_id: GHA-R002
        file: ci.yml
        severity: High
  32_gha_secret_spaced_run:
    description: "Workflow with ${{   secrets.API_TOKEN   }} (extra whitespace) in run"
    expected:
      - rule_id: GHA-R002
        file: ci.yml
        severity: High
  33_gha_secret_block_scalar_run:
    description: "Workflow with block scalar run: | interpolating ${{ secrets.SECRET_TOKEN }}"
    expected:
      - rule_id: GHA-R002
        file: ci.yml
        severity: High
  34_gha_secret_script_scope:
    description: "Workflow with step-level script: key interpolating ${{ secrets.SCRIPT_TOKEN }}"
    expected:
      - rule_id: GHA-R002
        file: ci.yml
        severity: High
  35_gha_secret_env_then_run:
    description: "Workflow with env-passed secret (TN) + run interpolation of ${{ secrets.TOKEN_STREAM }} (TP)"
    expected:
      - rule_id: GHA-R002
        file: ci.yml
        severity: High
  36_gha_secret_via_env_only:
    description: "Workflow passes secrets via env: mapping only (recommended pattern)"
    expected: []
  37_gha_run_env_var_ref:
    description: "Workflow run: references $HOME and make build (no secrets interpolation)"
    expected: []
  38_gha_run_no_secrets:
    description: "Workflow with run: make build and run: pytest -q (no secrets interpolated)"
    expected: []
  39_gha_no_secrets_at_all:
    description: "Workflow with no ${{ secrets.* }} tokens anywhere"
    expected: []
  40_gha_empty_run_block:
    description: "Workflow with run: \"\" empty string step"
    expected: []