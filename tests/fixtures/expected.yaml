# Ground truth for pipeline-audit snapshot validation.
# Drafted by AI per Option B — user review/veto required before v1.
#
# Each snapshot lists expected findings by (rule_id, file).
# validate.py compares actual findings against these expectations
# and computes precision + recall per rule.
#
# Convention:
#   expected: []  → no findings should fire (true negative)
#   expected: [{rule_id, file, severity}]  → true positive(s)

version: "1.0"
snapshots:
