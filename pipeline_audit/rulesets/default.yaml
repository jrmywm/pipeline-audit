version: "1.0"
metadata:
  name: default
  description: >
    Core DevSecOps pipeline audit signatures for Dockerfiles and GitHub
    Actions workflows.
  author: pipeline-auditors

rules:
  # ─── DOCKER-R001 ─────────────────────────────────────────────────────────
  - id: DOCKER-R001
    title: Final container stage may run as root
    severity: High
    target: dockerfile
    type: structural
    match:
      structural:
        kind: missing_instruction
        instruction: USER
    remediation: >
      Add a USER instruction near the end of the Dockerfile to specify a
      non-root user, e.g. `USER 1001` or `USER appuser`.
    references:
      - https://docs.docker.com/develop/develop-images/dockerfile_best-practices/#user

  # ─── DOCKER-R002 ─────────────────────────────────────────────────────────
  - id: DOCKER-R002
    title: Hardcoded secret in ENV or ARG instruction
    severity: Critical
    target: dockerfile
    type: regex
    match:
      regex:
        pattern: |-
          (?i)\b(?:ENV|ARG)\s+\S*(?:TOKEN|KEY|PASSWORD|SECRET|PASSWD|PWD|API_KEY|CREDENTIAL)[=\s]+(\S+)
        exclude_names:
          - NODE_ENV
          - BUILD_NUMBER
          - PATH
          - HOME
          - LANG
          - LC_ALL
        min_entropy: 0.0
        capture_group: 1
    remediation: >
      Move secrets out of the image layer. Inject at runtime via Vault,
      GitHub secrets, docker secrets, or SOPS-encrypted files.
    references:
      - https://docs.github.com/en/actions/security-guides/encrypted-secrets

  # ─── GHA-R001 ────────────────────────────────────────────────────────────
  - id: GHA-R001
    title: Unpinned GitHub Action (uses tag or branch instead of SHA)
    severity: Medium
    target: github_workflow
    type: structural
    match:
      structural:
        kind: uses_unpinned
        sha_pattern: "^[0-9a-f]{40}$"
    remediation: >
      Pin the action to a full 40-character commit SHA instead of a tag
      or branch reference, e.g. `uses: actions/checkout@<40-hex-sha>`.
    references:
      - https://docs.github.com/en/actions/security-guides/security-hardening-for-github-actions#using-third-party-actions

  # ─── GHA-R002 ────────────────────────────────────────────────────────────
  - id: GHA-R002
    title: GitHub secret interpolated into executable script
    severity: High
    target: github_workflow
    type: regex
    match:
      regex:
        pattern: '\$\{\{\s*secrets(?:\.[A-Za-z0-9_]+|\[\s*["''][A-Za-z0-9_]+["'']\s*\])\s*\}\}'
        scope_keys:
          - run
          - script
        exclude_keys:
          - env
    remediation: >
      Pass secrets to the step via the `env:` mapping and reference them as
      `$VAR_NAME` inside the bash script. Never interpolate `${{ secrets.* }}`
      directly into a run block.
    references:
      - https://docs.github.com/en/actions/security-guides/security-hardening-for-github-actions#using-secrets-securely

  - id: GHA-R003
    title: Workflow grants all GITHUB_TOKEN permissions write access
    severity: High
    target: github_workflow
    type: structural
    match:
      structural:
        kind: permissions_write_all
    remediation: >
      Replace permissions: write-all with the specific permissions each job
      requires. Grant read access by default and write access only where needed.
    references:
      - https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#permissions

  - id: GHA-R004
    title: Untrusted GitHub event text interpolated into executable script
    severity: High
    target: github_workflow
    type: regex
    match:
      regex:
        pattern: '\$\{\{\s*github\.(?:head_ref|event\.(?:pull_request\.(?:title|body|head\.ref)|issue\.(?:title|body)|comment\.body|head_commit\.message|discussion\.(?:title|body)|release\.(?:name|body)))\s*\}\}'
        scope_keys:
          - run
          - script
        exclude_keys:
          - env
    remediation: >
      Pass untrusted event data through an env variable and quote the variable
      in the script. Do not interpolate event text directly into run or script.
    references:
      - https://docs.github.com/en/actions/concepts/security/script-injections

  - id: GHA-R005
    title: Privileged pull request workflow executes after untrusted checkout
    severity: High
    target: github_workflow
    type: structural
    match:
      structural:
        kind: privileged_pr_checkout_execution
    remediation: >
      Do not run pull request code in a pull_request_target job. Use the
      unprivileged pull_request event for build and test work. If privileged
      automation is needed, keep untrusted code out of its execution path.
    references:
      - https://docs.github.com/en/actions/reference/security/securely-using-pull_request_target
      - https://securitylab.github.com/resources/github-actions-preventing-pwn-requests/

  - id: GHA-R006
    title: Privileged workflow executes an artifact from its triggering run
    severity: High
    target: github_workflow
    type: structural
    match:
      structural:
        kind: workflow_run_artifact_execution
    remediation: >
      Treat artifacts from a triggering workflow as untrusted data. Do not
      execute downloaded files in a workflow_run job with privileged token or
      secret access. Separate unprivileged execution from privileged actions.
    references:
      - https://docs.github.com/en/actions/reference/workflows-and-actions/events-that-trigger-workflows#workflow_run
      - https://securitylab.github.com/resources/github-actions-new-patterns-and-mitigations/
